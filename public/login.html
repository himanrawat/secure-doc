<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure Document Platform</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🔒 Secure Login</h1>
        <p>Access your secure documents</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required class="form-input" placeholder="you@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required class="form-input" placeholder="••••••••">
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn-primary btn-full">Login</button>
        </div>
        
        <div class="form-footer">
          <p>Don't have an account? <a href="/register.html">Register</a></p>
          <p><a href="/">Back to Home</a></p>
        </div>
      </form>
      
      <div id="error-message" class="error-message hidden"></div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-message');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || 'Login failed');
        }
        
        const data = await response.json();
        localStorage.setItem('authToken', data.token);
        
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect || '/dashboard.html';
        
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
